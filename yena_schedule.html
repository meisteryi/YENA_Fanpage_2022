<body>
    <div class="mainpage">
        <div class="header">

                        onmouseout="unhover(this);">

            </div>
            <div class="header01">
                <div class="navbar">
                    <a href="yena_profile.html">

                    <a href="yena_album.html">

                    <a href="yena_multimedia.html">

                    <a href="yena_gallery.html">

                    </a>
                    <a href="yena_schedule.html">

                    </a>
                    <div></div>
                </div>
            </div>
            <div class="navbar_logo">
                <a href=javascript:;" class="navbar__toggleBtn">
                    <i class="fa-solid fa-bars"></i>
                </a>
            </div>
        </div>
        <div class="mnavbar">
            <a href="yena_profile.html">

        <div class="all_contents">
            <div class="imagebox" style="max-width: 100%">
                <!-- <img src="yena_profile01.jpg" alt="" width="100%"> -->
            </div>
        </div>
        <div class="secondHeader">
            <div class="sheaderNav">SCHEDULE</div>
        </div>

            <iframe
                src="https://calendar.google.com/calendar/embed?height=600&wkst=1&bgcolor=%23fcf695&ctz=Asia%2FSeoul&showPrint=0&showTabs=0&showTz=0&showCalendars=0&title=SCHEDULE&showDate=1&src=OWNlYzY0N2RlYzkzZWJjYzc3MGI1OTE5ZDFhZTEzM2ZiYzY3NjQ4MjI0ZDY3YjBhYmM3ODgzMTNmNDYyN2NhMkBncm91cC5jYWxlbmRhci5nb29nbGUuY29t&src=a28uc291dGhfa29yZWEjaG9saWRheUBncm91cC52LmNhbGVuZGFyLmdvb2dsZS5jb20&color=%23F6BF26&color=%230B8043"

        </div>

    <a href="#" class="btn_gotop">
        <img src="topbtn.png" alt="" width="50vw">
    </a>

    <script>
        function hover(element) {
            element.setAttribute('src', 'yenalogo01.png');
        }
        function unhover(element) {
            element.setAttribute('src', 'yenalogo_pink.png');
        }
    </script>
    <script>
        const toggleBtn = document.querySelector('.navbar_logo');
        const menu = document.querySelector('.mnavbar');

        toggleBtn.addEventListener('click', () => {
            menu.classList.toggle('active');
        })
    </script>
    <script>
        $(window).scroll(function () {
            if ($(this).scrollTop() > 300) {
                $('.btn_gotop').show();
            } else {
                $('.btn_gotop').hide();
            }
        });
        $('.btn_gotop').click(function () {
            $('html, body').animate({ scrollTop: 0 }, 400);
            return false;
        });
    </script>
</body>

</html>

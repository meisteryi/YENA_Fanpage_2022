        <a href="#" class="btn_gotop">

        <script>
            function hover(element) {
                element.setAttribute('src', 'yenalogo01.png');
            }
            function unhover(element) {
                element.setAttribute('src', 'yenalogo_pink.png');
            }
        </script>
        <script src="http://code.jquery.com/jquery-latest.js"></script>
        <script src="lightbox/lightbox.js"></script>
        <script>
            $(document).ready(function () {
                $('.photosmiley').show();
                $('.photosmartphone').hide();
                $('.album01').click(function () {
                    $('.photosmartphone').hide();
                    $('.photosmiley').show();
                    return false;
                }); $('.album02').click(function () {
                    $('.photosmiley').hide();
                    $('.photosmartphone').show();
                    return false;
                });
            });
        </script>
        <script>
            const toggleBtn = document.querySelector('.navbar_logo');
            const menu = document.querySelector('.mnavbar');

            toggleBtn.addEventListener('click', () => {
                menu.classList.toggle('active');
            })
        </script>
        <script>
            $(window).scroll(function () {
                if ($(this).scrollTop() > 300) {
                    $('.btn_gotop').show();
                } else {
                    $('.btn_gotop').hide();
                }
            });
            $('.btn_gotop').click(function () {
                $('html, body').animate({ scrollTop: 0 }, 400);
                return false;
            });
        </script>
